<?xml version="1.0" encoding="utf-8"?>
<!-- Splash/About hero: pastel light field with slanted glass panels (tsh.io-inspired) behind the Salamander hand.
     Only NanoSVG-supported features are used (paths, linear/radial gradients, stop-opacity, transforms).
     Bounding-box gradient coordinates must be percentages: NanoSVG reads unitless ones as absolute pixels.
     The field fades to transparent towards the left and bottom so it blends into the white dialog background. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 width="360px" height="240px" viewBox="0 0 360 240">
<defs>
	<radialGradient id="Field" cx="372" cy="-24" r="400" gradientUnits="userSpaceOnUse">
		<stop offset="0" stop-color="#70C8FF"/>
		<stop offset="0.22" stop-color="#8DD4FF"/>
		<stop offset="0.45" stop-color="#B5B4FF"/>
		<stop offset="0.66" stop-color="#FFC269" stop-opacity="0.85"/>
		<stop offset="0.82" stop-color="#FFE0B0" stop-opacity="0.35"/>
		<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
	</radialGradient>
	<radialGradient id="Glow" cx="150" cy="40" r="170" gradientUnits="userSpaceOnUse">
		<stop offset="0" stop-color="#E8AFFF" stop-opacity="0.45"/>
		<stop offset="1" stop-color="#E8AFFF" stop-opacity="0"/>
	</radialGradient>
	<linearGradient id="Glass" x1="0%" y1="0%" x2="0%" y2="100%">
		<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
		<stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.18"/>
		<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
	</linearGradient>
	<linearGradient id="GlassDeep" x1="0%" y1="0%" x2="0%" y2="100%">
		<stop offset="0" stop-color="#9B99FF" stop-opacity="0.28"/>
		<stop offset="1" stop-color="#9B99FF" stop-opacity="0"/>
	</linearGradient>
	<linearGradient id="Edge" x1="0%" y1="0%" x2="0%" y2="100%">
		<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
		<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
	</linearGradient>
	<linearGradient id="BottomFade" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="240">
		<stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
		<stop offset="1" stop-color="#FFFFFF"/>
	</linearGradient>
</defs>

<g id="Field">
	<rect x="0" y="0" width="360" height="240" fill="url(#Field)"/>
	<rect x="0" y="0" width="360" height="240" fill="url(#Glow)"/>
</g>

<!-- Tall glass panels whose top edges slope like perspective slabs. -->
<g id="Panels">
	<path fill="url(#Glass)" d="M92,40 L132,26 L132,240 L92,240 Z"/>
	<path fill="url(#Edge)" d="M92,40 L94,39.3 L94,200 L92,200 Z"/>
	<path fill="url(#GlassDeep)" d="M150,20 L196,4 L196,240 L150,240 Z"/>
	<path fill="url(#Glass)" d="M168,48 L214,32 L214,240 L168,240 Z"/>
	<path fill="url(#Edge)" d="M168,48 L170,47.3 L170,220 L168,220 Z"/>
	<path fill="url(#Glass)" d="M246,0 L300,0 L300,240 L246,240 Z"/>
	<path fill="url(#Edge)" d="M246,0 L248,0 L248,210 L246,210 Z"/>
	<path fill="url(#GlassDeep)" d="M312,22 L360,6 L360,240 L312,240 Z"/>
</g>

<!-- Salamander hand; the wrist leaves the bottom edge so it merges with the white background/band. -->
<g id="Hand" transform="translate(92,62) scale(0.66)">
	<g fill="#3B3E3F" fill-opacity="0.06">
		<path transform="translate(5,7)" d="M146.3,254c33.8,10,39.6-19.3,39.1-32.2c-1.1-33.2-11.6-47-43.6-54.4c-34.7-8-31.8-0.1-64.9-3c-37.5-2.5-35.9-58.7,7.1-55.7c22.6,0.7,23.6,16,51.8,13.2c35.9-3.6,30.4-25.3,17.2-48.3c-7.7-13.4-29.4-26.8-37.1-40.2C95.9-1.2,147.4-35.1,164.9,0.9c7.7,13.4,11.5,32.8,18.5,46.6c10.7,20.9,20.9,34.3,30.2,33.9c9.3,0.4,19.6-13,30.2-33.9c7-13.8,10.8-33.2,18.5-46.6c17.4-36,69-2.1,49.1,32.5c-7.7,13.4-29.4,26.8-37.1,40.2c-13.2,23-18.7,44.7,17.2,48.3c28.1,2.9,29.2-12.5,51.8-13.2c43-3.1,44.6,53.1,7.1,55.7c-33.2,2.8-30.2-5.1-64.9,3c-32,7.4-42.5,21.2-43.6,54.4c-0.4,13,4.7,40.7,37,32.9c2.7-0.6,6.4-1.9,7.8-2.6c-13.7,7.5-29.1,17.8-71.8,17.8c-42.5,0-48.9-6.5-75.1-18C143.1,252.9,141.3,252.6,146.3,254z"/>
		<path transform="translate(10,14)" d="M146.3,254c33.8,10,39.6-19.3,39.1-32.2c-1.1-33.2-11.6-47-43.6-54.4c-34.7-8-31.8-0.1-64.9-3c-37.5-2.5-35.9-58.7,7.1-55.7c22.6,0.7,23.6,16,51.8,13.2c35.9-3.6,30.4-25.3,17.2-48.3c-7.7-13.4-29.4-26.8-37.1-40.2C95.9-1.2,147.4-35.1,164.9,0.9c7.7,13.4,11.5,32.8,18.5,46.6c10.7,20.9,20.9,34.3,30.2,33.9c9.3,0.4,19.6-13,30.2-33.9c7-13.8,10.8-33.2,18.5-46.6c17.4-36,69-2.1,49.1,32.5c-7.7,13.4-29.4,26.8-37.1,40.2c-13.2,23-18.7,44.7,17.2,48.3c28.1,2.9,29.2-12.5,51.8-13.2c43-3.1,44.6,53.1,7.1,55.7c-33.2,2.8-30.2-5.1-64.9,3c-32,7.4-42.5,21.2-43.6,54.4c-0.4,13,4.7,40.7,37,32.9c2.7-0.6,6.4-1.9,7.8-2.6c-13.7,7.5-29.1,17.8-71.8,17.8c-42.5,0-48.9-6.5-75.1-18C143.1,252.9,141.3,252.6,146.3,254z"/>
	</g>
	<path fill="#FFFFFF" d="M146.3,254c33.8,10,39.6-19.3,39.1-32.2c-1.1-33.2-11.6-47-43.6-54.4c-34.7-8-31.8-0.1-64.9-3c-37.5-2.5-35.9-58.7,7.1-55.7c22.6,0.7,23.6,16,51.8,13.2c35.9-3.6,30.4-25.3,17.2-48.3c-7.7-13.4-29.4-26.8-37.1-40.2C95.9-1.2,147.4-35.1,164.9,0.9c7.7,13.4,11.5,32.8,18.5,46.6c10.7,20.9,20.9,34.3,30.2,33.9c9.3,0.4,19.6-13,30.2-33.9c7-13.8,10.8-33.2,18.5-46.6c17.4-36,69-2.1,49.1,32.5c-7.7,13.4-29.4,26.8-37.1,40.2c-13.2,23-18.7,44.7,17.2,48.3c28.1,2.9,29.2-12.5,51.8-13.2c43-3.1,44.6,53.1,7.1,55.7c-33.2,2.8-30.2-5.1-64.9,3c-32,7.4-42.5,21.2-43.6,54.4c-0.4,13,4.7,40.7,37,32.9c2.7-0.6,6.4-1.9,7.8-2.6c-13.7,7.5-29.1,17.8-71.8,17.8c-42.5,0-48.9-6.5-75.1-18C143.1,252.9,141.3,252.6,146.3,254z"/>
	<g fill="#B5B4FF" fill-opacity="0.55">
		<path d="M127.4,3.8c-18.2,20.6,12.9,31.9,34.6,62.3C147,37.9,124.6,19.4,127.4,3.8L127.4,3.8z"/>
		<path d="M61.8,134.6c2.5,27.3,32.1,12.5,69.1,17.5C100,143.7,71.3,147.4,61.8,134.6L61.8,134.6z"/>
		<path d="M292.4,0.4c-26.6-7-22.7,25.9-40,58.9C270.8,33.3,277.1,5,292.4,0.4L292.4,0.4z"/>
		<path d="M365.5,132.1c-9.9-25.6-34.3-3.3-71.2,2C326.2,133.8,352.9,122.4,365.5,132.1L365.5,132.1z"/>
	</g>
</g>

<!-- Fade the bottom edge into the white dialog background (the About dialog shows it floating). -->
<rect x="0" y="150" width="360" height="90" fill="url(#BottomFade)"/>
</svg>
