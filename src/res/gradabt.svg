<?xml version="1.0" encoding="utf-8"?>
<!-- About dialog footer: graphite surface topped by a lavender/peach/sky accent line (tsh.io-inspired).
     Keep the surface colour in sync with CAboutDialog's button background brush in logo.cpp. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 width="512px" height="48px" viewBox="0 0 512 48">
<defs>
	<linearGradient id="Accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="0">
		<stop offset="0" stop-color="#B5B4FF"/>
		<stop offset="0.45" stop-color="#FFC269"/>
		<stop offset="1" stop-color="#8DD4FF"/>
	</linearGradient>
</defs>
<rect y="3" fill="#3B3E3F" width="512" height="45"/>
<rect fill="url(#Accent)" width="512" height="3"/>
</svg>
