<?xml version="1.0" encoding="utf-8"?>
<!-- Splash status band: graphite surface topped by a lavender/peach/sky accent line (tsh.io-inspired).
     The caller stretches this band vertically, so the accent keeps roughly the same proportion at any DPI. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 width="512px" height="40px" viewBox="0 0 512 40">
<defs>
	<linearGradient id="Accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="0">
		<stop offset="0" stop-color="#B5B4FF"/>
		<stop offset="0.45" stop-color="#FFC269"/>
		<stop offset="1" stop-color="#8DD4FF"/>
	</linearGradient>
	<linearGradient id="Surface" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="40">
		<stop offset="0" stop-color="#313435"/>
		<stop offset="1" stop-color="#3B3E3F"/>
	</linearGradient>
</defs>
<rect y="3" fill="url(#Surface)" width="512" height="37"/>
<rect fill="url(#Accent)" width="512" height="3"/>
</svg>
