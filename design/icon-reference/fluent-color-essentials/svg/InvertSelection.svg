<!-- Reference master: 64 px inspection size with the production 16 px design grid preserved. -->
<!-- Fluent Color Essentials: alternating filled cells communicate inversion without extra detail. -->
<svg width="64" height="64" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="2.5" y="2.5" width="5" height="5" rx="1" fill="#0F6CBD"/>
<rect x="8.5" y="2.5" width="5" height="5" rx="1" fill="white" stroke="#616161"/>
<rect x="2.5" y="8.5" width="5" height="5" rx="1" fill="white" stroke="#616161"/>
<rect x="8.5" y="8.5" width="5" height="5" rx="1" fill="#0F6CBD"/>
</svg>
