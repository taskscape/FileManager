name: Build and Release Installer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Installer (x64 Release)
    runs-on: windows-2022

    env:
      BUILD_CONFIGURATION: Release
      SOLUTION_PATH: 'src\vcxproj\salamand.sln'
      # OPENSAL_BUILD_DIR MUST end with a backslash as expected by props files
      OPENSAL_BUILD_DIR: '${{ github.workspace }}\build_stage\'
      INSTALLER_STAGING_DIR: 'Installer\Installer_Staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild in PATH (VS2022)
        uses: microsoft/setup-msbuild@v2

      - name: Download OpenSSL Libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $opensslZip = Join-Path $env:RUNNER_TEMP "openssl.zip"
          $uri = "https://intelitech.home.pl/install/openssl-1.0.2u-x64_86-win64.zip"

          $resp = Invoke-WebRequest -Uri $uri -OutFile $opensslZip -MaximumRedirection 10 -PassThru
          Write-Host "HTTP status: $($resp.StatusCode)"
          Write-Host "Content-Type: $($resp.Headers.'Content-Type')"
          Write-Host "Downloaded bytes: $((Get-Item $opensslZip).Length)"

          # Validate: ZIP files start with 'PK' (0x50 0x4B).
          $bytes = [System.IO.File]::ReadAllBytes($opensslZip)
          if ($bytes.Length -lt 2) {
            throw "OpenSSL download is unexpectedly short."
          }

          if ($bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4B) {
            Write-Host "First bytes: $('{0:X2} {1:X2}' -f $bytes[0], $bytes[1])"
            Write-Host "File head (as text):"
            Get-Content -Path $opensslZip -TotalCount 20 | ForEach-Object { $_ }
            throw "OpenSSL download is not a ZIP (likely received HTML). URL may have changed or requires different source."
          }

          Expand-Archive -Path $opensslZip -DestinationPath "utils" -Force
          Remove-Item $opensslZip

      - name: Build Solution (Release | x64)
        run: |
          New-Item -ItemType Directory -Force -Path $env:OPENSAL_BUILD_DIR
          # We do NOT pass /p:OutDir here, we let the project props use OPENSAL_BUILD_DIR
          msbuild $env:SOLUTION_PATH /m /t:Build /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=x64 /p:PreferredToolArchitecture=x64

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          # Add Inno Setup to PATH
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Installer Files
        run: |
          # Stage files for Inno Setup
          powershell.exe -File tools\prepare_installer.ps1 -BuildDir $env:OPENSAL_BUILD_DIR -StagingDir $env:INSTALLER_STAGING_DIR -BuildNumber ${{ github.run_number }}

          $requiredFiles = @(
            (Join-Path $env:INSTALLER_STAGING_DIR 'salamand.exe')
            (Join-Path $env:INSTALLER_STAGING_DIR 'salmon.exe')
            (Join-Path $env:INSTALLER_STAGING_DIR 'LICENSE')
          )

          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path $_) }
          if ($missingFiles.Count -gt 0) {
            $missingFiles | ForEach-Object { Write-Host "::error::Missing staged installer file: $_" }
            throw "Installer staging is incomplete."
          }

      - name: Build Installer with Inno Setup
        run: |
          # Compile the Inno Setup script
          $sourcePath = Split-Path -Leaf $env:INSTALLER_STAGING_DIR
          iscc.exe /DSourcePath="$sourcePath" /DBuildNumber=${{ github.run_number }} "Installer\setup.iss"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 5.0.${{ github.run_number }}
          name: Open Salamander 5.0.${{ github.run_number }}
          files: Installer\Output\OpenSalamander_5.0.${{ github.run_number }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
