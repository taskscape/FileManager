name: Build and Release Installer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Keep an unavailable UI runner from accumulating obsolete release queues; a
# newer main revision supersedes any older installer release candidate.
concurrency:
  group: build-and-release-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Release write access is granted only to the protected publish job below.
  contents: read

env:
  # Opt JavaScript actions (actions/checkout, microsoft/setup-msbuild,
  # softprops/action-gh-release, ...) into the Node.js 24 runtime ahead of the
  # June 2026 default switch. Silences the runner deprecation warning about
  # Node.js 20 being removed on 2026-09-16. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-tests:
    name: Complete automated release gate
    # Every UI fixture mutates profile state, so the release gate uses the same
    # dedicated unlocked desktop as the existing Application Verifier lane.
    # Pin public-repository UI work to its dedicated, repository-restricted runner group.
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Debug
      SOLUTION_PATH: 'src\vcxproj\salamand.sln'
      PLATFORM_TOOLSET: v145
      OPENSAL_BUILD_DIR: '${{ github.workspace }}\build_stage\'
      FILEMANAGER_UI_ISOLATED: '1'
      FILEMANAGER_UI_CONFIG_FAULT_INJECTION: '1'
      FILEMANAGER_UI_RECYCLE_BIN: '1'
      # Dedicated-volume roots and the runtime FTP command are configured as
      # repository variables; strict skip handling blocks release if any is absent.
      FILEMANAGER_UI_CROSS_VOLUME_ROOT: '${{ vars.FILEMANAGER_UI_CROSS_VOLUME_ROOT }}'
      FILEMANAGER_UI_ADS_UNSUPPORTED_TARGET_ROOT: '${{ vars.FILEMANAGER_UI_ADS_UNSUPPORTED_TARGET_ROOT }}'
      FILEMANAGER_UI_FTP_ORGANIZE_COMMAND: '${{ vars.FILEMANAGER_UI_FTP_ORGANIZE_COMMAND }}'

    steps:
      - name: Checkout complete history
        # Pin actions by reviewed commit to keep the release input graph immutable.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        # The setup action's default search omits VS 2026, so select its major version explicitly.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          vsversion: '18.0'

      - name: Build Debug x64 test artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OPENSAL_BUILD_DIR | Out-Null
          msbuild $env:SOLUTION_PATH /m /t:Build /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=x64 /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=x64 /nr:false

      - name: Resolve strict runner inputs
        shell: pwsh
        env:
          PUSH_BASE_COMMIT: '${{ github.event.before }}'
        run: |
          # Push events provide the exact pre-push revision; manual releases
          # compare with the first parent of the explicitly selected revision.
          $baseCommit = $env:PUSH_BASE_COMMIT
          if ([string]::IsNullOrWhiteSpace($baseCommit) -or $baseCommit -match '^0+$') {
            $baseCommit = 'HEAD^'
          }
          git rev-parse --verify "$baseCommit^{commit}" | Out-Null

          $sqlite = Get-ChildItem $env:OPENSAL_BUILD_DIR -Filter sqlite.dll -Recurse |
            Where-Object { $_.FullName -like '*Debug_x64*' } | Select-Object -First 1
          $executable = Get-ChildItem $env:OPENSAL_BUILD_DIR -Filter salamand.exe -Recurse |
            Where-Object { $_.FullName -like '*Debug_x64*' } | Select-Object -First 1
          if ($null -eq $sqlite -or $null -eq $executable) {
            throw 'The strict release runner requires Debug x64 sqlite.dll and salamand.exe artifacts.'
          }

          "RELEASE_BASE_COMMIT=$baseCommit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLITE_TEST_DLL=$($sqlite.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FILEMANAGER_UI_EXE=$($executable.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run every automated test without skips
        shell: pwsh
        # Keep the strict test invocation as a workflow command so Actions can parse and execute this step.
        run: .\scripts\runtests.ps1 -BaseCommit $env:RELEASE_BASE_COMMIT -SqliteDll $env:SQLITE_TEST_DLL -FailOnSkipped -PlatformToolset v145 -NUnitTrxPath $env:RUNNER_TEMP\runtests-v145.trx

      - name: Upload v145 complete UI results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Preserve the full executable result inventory for toolset parity, not just source contracts.
          name: toolset-ui-results-v145-${{ github.sha }}
          path: ${{ runner.temp }}\runtests-v145.trx
          if-no-files-found: error

      - name: Upload Application Verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-application-verifier-logs
          path: TestResults\application-verifier-logs
          if-no-files-found: warn

  toolset-parity-v143-ui:
    name: Run complete UI suite with v143
    needs: release-tests
    # The same disposable desktop, volumes, and verifier installation make the
    # v143 inventory comparable to the gated v145 executable run above.
    # Keep the parity UI run on the same repository-restricted desktop as the release gate.
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]
    permissions:
      contents: read

    env:
      FILEMANAGER_UI_ISOLATED: '1'
      FILEMANAGER_UI_CONFIG_FAULT_INJECTION: '1'
      FILEMANAGER_UI_RECYCLE_BIN: '1'
      FILEMANAGER_UI_CROSS_VOLUME_ROOT: '${{ vars.FILEMANAGER_UI_CROSS_VOLUME_ROOT }}'
      FILEMANAGER_UI_ADS_UNSUPPORTED_TARGET_ROOT: '${{ vars.FILEMANAGER_UI_ADS_UNSUPPORTED_TARGET_ROOT }}'
      FILEMANAGER_UI_FTP_ORGANIZE_COMMAND: '${{ vars.FILEMANAGER_UI_FTP_ORGANIZE_COMMAND }}'

    steps:
      - name: Checkout complete history
        # The v143 UI job must use the exact commit gated by the v145 release job.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        # The parity run must resolve VS 2026 instead of the action's older default search set.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          vsversion: '18.0'

      - name: Run complete v143 verification without skips
        shell: pwsh
        # Keep the v143 verification command explicit so Actions parses this step correctly.
        run: .\scripts\runtests.ps1 -BaseCommit HEAD^ -FailOnSkipped -PlatformToolset v143 -NUnitTrxPath $env:RUNNER_TEMP\runtests-v143.trx

      - name: Upload v143 complete UI results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolset-ui-results-v143-${{ github.sha }}
          path: ${{ runner.temp }}\runtests-v143.trx
          if-no-files-found: error

  toolset-parity-v145:
    name: Produce v145 Release artifact manifest
    needs: release-tests
    # Restrict the v145 artifact job to the dedicated group that may serve this public repository.
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Release
      SOLUTION_PATH: 'src\vcxproj\salamand.sln'
      PLATFORM_TOOLSET: v145
      OPENSAL_BUILD_DIR: '${{ github.workspace }}\toolset-v145\'

    steps:
      - name: Checkout
        # The comparison must build the exact commit verified by the release-test job.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        # v145 is supplied by VS 2026, which requires an explicit action version selector.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          vsversion: '18.0'

      - name: Build Release x64 with v145
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OPENSAL_BUILD_DIR | Out-Null
          msbuild $env:SOLUTION_PATH /m /t:Build /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=x64 /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=x64 /nr:false

      - name: Write v145 artifact manifest
        shell: pwsh
        run: .\tools\new-toolset-pe-manifest.ps1 -BuildRoot $env:OPENSAL_BUILD_DIR -Toolset v145 -OutputPath $env:RUNNER_TEMP\v145-pe-manifest.json

      - name: Run v145 native regression subset
        shell: pwsh
        run: dotnet test .\tests\FileManager.UiTests\FileManager.UiTests.csproj --filter "FullyQualifiedName~NativeSafetyRegressionTests" --results-directory $env:RUNNER_TEMP --logger "trx;LogFileName=v145-native.trx"

      - name: Upload v145 artifact manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The build job compares this immutable manifest against the hosted v143 release output.
          name: toolset-pe-manifest-v145-${{ github.sha }}
          path: |
            ${{ runner.temp }}\v145-pe-manifest.json
            ${{ runner.temp }}\v145-native.trx
          if-no-files-found: error

  build:
    name: Build Installer (x64 Release)
    # Publishing cannot begin until the unified runner has executed every test
    # and rejected both failures and missing prerequisites.
    needs: [release-tests, toolset-parity-v143-ui, toolset-parity-v145]
    runs-on: windows-2022
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Release
      SOLUTION_PATH: 'src\vcxproj\salamand.sln'
      # OPENSAL_BUILD_DIR MUST end with a backslash as expected by props files
      OPENSAL_BUILD_DIR: '${{ github.workspace }}\build_stage\'
      INSTALLER_STAGING_DIR: 'Installer\Installer_Staging'
      # The project files target the VS2026 v145 toolset for local development.
      # GitHub-hosted runners only ship VS2022 (v143), and v145 (VS2026, prerelease)
      # cannot be bolted onto VS2022, so CI pins the build to v143 via a global MSBuild
      # property (overrides the per-project <PlatformToolset>v145</PlatformToolset>).
      # The same sources build identically on both toolsets. Change to v145 only on a
      # runner that has VS2026 installed.
      PLATFORM_TOOLSET: v143

    steps:
      - name: Checkout
        # Pin actions by reviewed commit to keep the release input graph immutable.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup MSBuild in PATH (VS2022)
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        # dumpbin in the Release audit is supplied by this same pinned toolchain environment.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Build Solution (Release | x64)
        run: |
          New-Item -ItemType Directory -Force -Path $env:OPENSAL_BUILD_DIR
          # We do NOT pass /p:OutDir here, we let the project props use OPENSAL_BUILD_DIR
          msbuild $env:SOLUTION_PATH /m /t:Build /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=x64 /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=x64

      - name: Audit Release PE hardening
        shell: pwsh
        run: |
          # Inspect linked binaries so a project-level override cannot silently weaken the common baseline.
          .\tools\audit-pe-hardening.ps1 -BuildRoot $env:OPENSAL_BUILD_DIR

      - name: Write v143 artifact manifest
        shell: pwsh
        run: .\tools\new-toolset-pe-manifest.ps1 -BuildRoot $env:OPENSAL_BUILD_DIR -Toolset v143 -OutputPath $env:RUNNER_TEMP\v143-pe-manifest.json

      - name: Run v143 native regression subset
        shell: pwsh
        run: dotnet test .\tests\FileManager.UiTests\FileManager.UiTests.csproj --filter "FullyQualifiedName~NativeSafetyRegressionTests" --results-directory $env:RUNNER_TEMP --logger "trx;LogFileName=v143-native.trx"

      - name: Retrieve v145 artifact manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolset-pe-manifest-v145-${{ github.sha }}
          path: ${{ runner.temp }}\toolset-manifests

      - name: Compare v143 and v145 release artifacts
        shell: pwsh
        run: .\tools\compare-toolset-pe-manifests.ps1 -V143Manifest $env:RUNNER_TEMP\v143-pe-manifest.json -V145Manifest $env:RUNNER_TEMP\toolset-manifests\v145-pe-manifest.json

      - name: Compare v143 and v145 native test results
        shell: pwsh
        run: .\tools\compare-vstest-trx.ps1 -V143Results $env:RUNNER_TEMP\v143-native.trx -V145Results $env:RUNNER_TEMP\toolset-manifests\v145-native.trx

      - name: Retrieve complete v143 and v145 UI results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: toolset-ui-results-*
          path: ${{ runner.temp }}\toolset-ui-results
          merge-multiple: false

      - name: Compare v143 and v145 complete UI results
        shell: pwsh
        run: .\tools\compare-vstest-trx.ps1 -V143Results $env:RUNNER_TEMP\toolset-ui-results\toolset-ui-results-v143-${{ github.sha }}\runtests-v143.trx -V145Results $env:RUNNER_TEMP\toolset-ui-results\toolset-ui-results-v145-${{ github.sha }}\runtests-v145.trx

      - name: Index and verify private release symbols
        shell: pwsh
        run: |
          # The index carries the CodeView GUID/age and immutable module/PDB hashes required for exact-build symbolization.
          $symbolIndex = Join-Path $env:RUNNER_TEMP 'release-symbol-index.json'
          .\tools\new-symbol-index.ps1 -BuildRoot $env:OPENSAL_BUILD_DIR -OutputPath $symbolIndex
          .\tools\test-symbol-index.ps1 -BuildRoot $env:OPENSAL_BUILD_DIR -IndexPath $symbolIndex

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          # The lock file makes a tool update an explicit reviewed source change.
          $input = (Get-Content tools\release-inputs.json -Raw | ConvertFrom-Json).inputs.innoSetup
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-installer.exe'
          Invoke-WebRequest -Uri $input.url -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $input.sha256) {
            throw "Pinned Inno Setup SHA-256 mismatch: expected $($input.sha256), got $actualHash."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike "*CN=$($input.publisher)*") {
            throw "Pinned Inno Setup Authenticode verification failed: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE." }
          $innoPath = 'C:\Program Files (x86)\Inno Setup 6'
          $iscc = Join-Path $innoPath 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Pinned Inno Setup did not install $iscc." }
          if ((Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion -notmatch '^6\.7\.3') {
            throw "Installed Inno Setup version does not match the locked version $($input.version)."
          }
          $innoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Installer Files
        run: |
          # Stage files for Inno Setup
          powershell.exe -File tools\prepare_installer.ps1 -BuildDir $env:OPENSAL_BUILD_DIR -StagingDir $env:INSTALLER_STAGING_DIR -BuildNumber ${{ github.run_number }}

          $requiredFiles = @(
            (Join-Path $env:INSTALLER_STAGING_DIR 'salamand.exe')
            (Join-Path $env:INSTALLER_STAGING_DIR 'salmon.exe')
            (Join-Path $env:INSTALLER_STAGING_DIR 'LICENSE')
          )

          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path $_) }
          if ($missingFiles.Count -gt 0) {
            $missingFiles | ForEach-Object { Write-Host "::error::Missing staged installer file: $_" }
            throw "Installer staging is incomplete."
          }

      - name: Build Installer with Inno Setup
        run: |
          # Compile the Inno Setup script
          $sourcePath = Split-Path -Leaf $env:INSTALLER_STAGING_DIR
          iscc.exe /DSourcePath="$sourcePath" /DBuildNumber=${{ github.run_number }} "Installer\setup.iss"

      - name: Preserve verified installer for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Artifact immutability prevents publish from receiving a rebuilt installer.
          name: release-installer-${{ github.sha }}
          path: Installer\Output\OpenSalamander_6.0.${{ github.run_number }}.exe
          if-no-files-found: error

      - name: Preserve private symbols for crash analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Keep PDBs out of the public release while retaining exact-build diagnostics.
          name: private-symbols-${{ github.sha }}
          path: |
            ${{ env.OPENSAL_BUILD_DIR }}\**\*.pdb
            ${{ runner.temp }}\release-symbol-index.json
          if-no-files-found: error
          retention-days: 180

  publish:
    name: Publish verified installer
    needs: build
    runs-on: windows-2022
    environment: production
    permissions:
      contents: write

    steps:
      - name: Retrieve the immutable installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-installer-${{ github.sha }}
          path: Installer\Output

      - name: Create Release
        uses: softprops/action-gh-release@e5f48c3b7b613b7a911e58a617b757074c4c790d # v2.0.2
        with:
          # Keep the release-managed major separate from GitHub's automatic run number.
          tag_name: 6.0.${{ github.run_number }}
          name: Open Salamander 6.0.${{ github.run_number }}
          files: Installer\Output\OpenSalamander_6.0.${{ github.run_number }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
