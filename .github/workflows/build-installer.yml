name: Build and Release Installer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Keep an unavailable UI runner from accumulating obsolete release queues; a
# newer main revision supersedes any older installer release candidate.
concurrency:
  group: build-and-release-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Release write access is granted only to the protected publish job below.
  contents: read

jobs:
  release-tests:
    name: Complete automated release gate
    # Every UI fixture mutates profile state, so the release gate uses the same
    # dedicated unlocked desktop as the existing Application Verifier lane.
    # Pin public-repository UI work to its dedicated, repository-restricted runner group.
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Debug
      SOLUTION_PATH: 'src\vcxproj\salamand.sln'
      PLATFORM_TOOLSET: v145
      OPENSAL_BUILD_DIR: '${{ github.workspace }}\build_stage\'
      FILEMANAGER_UI_ISOLATED: '1'
      # The deterministic release suite uses a disposable profile namespace.
      FILEMANAGER_UI_CONFIG_ROOT: 'Software\Open Salamander\6.0-filemanager-testdata'
      FILEMANAGER_UI_CONFIG_FAULT_INJECTION: '1'
      FILEMANAGER_UI_RECYCLE_BIN: '1'

    steps:
      - name: Checkout complete history
        # Pin actions by reviewed commit to keep the release input graph immutable.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        # Use the runner's fixed VS 2026 path because version discovery excludes the current 18.9 release.
        shell: pwsh
        run: .\tools\setup-vs2026-buildtools.ps1

      - name: Build Debug x64 test artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OPENSAL_BUILD_DIR | Out-Null
          msbuild $env:SOLUTION_PATH /m /t:Build /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=x64 /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=x64 /nr:false

      - name: Resolve strict runner inputs
        shell: pwsh
        env:
          PUSH_BASE_COMMIT: '${{ github.event.before }}'
        run: |
          # Push events provide the exact pre-push revision; manual releases
          # compare with the first parent of the explicitly selected revision.
          $baseCommit = $env:PUSH_BASE_COMMIT
          if ([string]::IsNullOrWhiteSpace($baseCommit) -or $baseCommit -match '^0+$') {
            $baseCommit = 'HEAD^'
          }
          # Force-pushes can leave the event's previous revision outside the checkout; compare with the current parent instead.
          try {
            git cat-file -e "$baseCommit^{commit}" 2>$null
            $baseCommitIsAvailable = $LASTEXITCODE -eq 0
          }
          catch {
            $baseCommitIsAvailable = $false
          }
          if (-not $baseCommitIsAvailable) {
            $baseCommit = 'HEAD^'
          }
          git rev-parse --verify "$baseCommit^{commit}" | Out-Null

          $sqlite = Get-ChildItem $env:OPENSAL_BUILD_DIR -Filter sqlite.dll -Recurse |
            Where-Object { $_.FullName -like '*Debug_x64*' } | Select-Object -First 1
          $executable = Get-ChildItem $env:OPENSAL_BUILD_DIR -Filter salamand.exe -Recurse |
            Where-Object { $_.FullName -like '*Debug_x64*' } | Select-Object -First 1
          if ($null -eq $sqlite -or $null -eq $executable) {
            throw 'The strict release runner requires Debug x64 sqlite.dll and salamand.exe artifacts.'
          }

          "RELEASE_BASE_COMMIT=$baseCommit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLITE_TEST_DLL=$($sqlite.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FILEMANAGER_UI_EXE=$($executable.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run release tests without unexpected skips
        shell: pwsh
        # Exclude manifest quarantines and the credentialed external FTPS smoke test; Application Verifier remains an instrumented nightly diagnostic lane.
        run: .\scripts\runtests.ps1 -NoReleasePipeline -BaseCommit $env:RELEASE_BASE_COMMIT -SqliteDll $env:SQLITE_TEST_DLL -FailOnSkipped -SkipLockVerifier -NUnitFilter 'TestCategory!=Quarantined&TestCategory!=LiveFtp' -PlatformToolset v145 -NUnitTrxPath $env:RUNNER_TEMP\runtests-v145.trx

      - name: Upload v145 complete UI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Preserve the full executable result inventory for release diagnosis, not just source contracts.
          name: toolset-ui-results-v145-${{ github.sha }}
          path: ${{ runner.temp }}\runtests-v145.trx
          # A missing UI TRX is expected when the runner reports the complete UI suite as an allowed privilege skip.
          if-no-files-found: warn

  build:
    name: Build Installer (x64 Release)
    # Packaging uses the same VS 2026 toolchain that passed the release gate.
    needs: release-tests
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Release
      SOLUTION_PATH: 'src\vcxproj\salamand.sln'
      # OPENSAL_BUILD_DIR MUST end with a backslash as expected by props files
      OPENSAL_BUILD_DIR: '${{ github.workspace }}\build_stage\'
      INSTALLER_STAGING_DIR: 'Installer\Installer_Staging'
      # The repository supports one compiler contract: VS 2026's v145 toolset.
      PLATFORM_TOOLSET: v145

    steps:
      - name: Checkout
        # Pin actions by reviewed commit to keep the release input graph immutable.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        # dumpbin and MSBuild must come from the same verified VS 2026 installation.
        shell: pwsh
        run: .\tools\setup-vs2026-buildtools.ps1

      - name: Preflight pinned Inno Setup
        shell: pwsh
        # Provision the external compiler before spending time on the Release build.
        run: |
          $iscc = & .\tools\install-pinned-inno-setup.ps1
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw 'Pinned Inno Setup preflight did not produce ISCC.exe.'
          }
          Write-Host "Pinned Inno Setup preflight passed: $iscc" -ForegroundColor Green

      # Keep the separate installer job visible while sharing its exact implementation with local -ReleasePipeline runs.
      - name: Run Build Installer pass (Release | x64)
        shell: pwsh
        run: .\tools\build-release-installer.ps1 -BuildDirectory $env:OPENSAL_BUILD_DIR -InstallerStagingDirectory $env:INSTALLER_STAGING_DIR -BuildNumber '${{ github.run_number }}' -PlatformToolset $env:PLATFORM_TOOLSET

      - name: Upload Inno Setup provisioning logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Preserve installer diagnostics even when the preflight or Build Installer pass fails.
          name: inno-setup-provisioning-logs-${{ github.sha }}
          path: ${{ runner.temp }}\FileManager\InnoSetup\logs\**
          if-no-files-found: warn

      - name: Preserve verified installer for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact immutability prevents publish from receiving a rebuilt installer.
          name: release-installer-${{ github.sha }}
          path: Installer\Output\OpenSalamander_6.0.${{ github.run_number }}.exe
          if-no-files-found: error

      - name: Preserve private symbols for crash analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Keep PDBs out of the public release while retaining exact-build diagnostics.
          name: private-symbols-${{ github.sha }}
          path: |
            ${{ env.OPENSAL_BUILD_DIR }}\**\*.pdb
            ${{ runner.temp }}\release-symbol-index.json
          if-no-files-found: error
          # The repository cap is 90 days; request that value directly to avoid a runner warning.
          retention-days: 90

  publish:
    name: Publish verified installer
    needs: build
    # Keep publishing on the repository-restricted VS 2026 runner family.
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]
    environment: production
    permissions:
      contents: write

    steps:
      - name: Retrieve the immutable installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-installer-${{ github.sha }}
          path: Installer\Output

      - name: Create Release
        # github-script runs natively on Node 24 and uploads the exact verified installer.
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: 6.0.${{ github.run_number }}
          RELEASE_NAME: Open Salamander 6.0.${{ github.run_number }}
          INSTALLER_PATH: Installer/Output/OpenSalamander_6.0.${{ github.run_number }}.exe
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Retry transient GitHub API/upload failures without masking authentication or validation errors.
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const name = process.env.RELEASE_NAME;
            const installerPath = process.env.INSTALLER_PATH;

            // Keep reruns idempotent while replacing only this build's immutable asset.
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              ({ data: release } = await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, tag_name: tag, name, draft: false, prerelease: false
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name, draft: false, prerelease: false
              }));
            }

            const assetName = path.basename(installerPath);
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id
            });
            for (const asset of existingAssets.filter((item) => item.name === assetName)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

            const installer = fs.readFileSync(installerPath);
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: assetName, data: installer,
              headers: { 'content-type': 'application/octet-stream', 'content-length': installer.length }
            });
