name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opt JavaScript actions into the Node.js 24 runtime ahead of the June 2026
  # default switch; silences the runner's Node.js 20 deprecation warning. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pr-msbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} Debug (fail on warnings)
    # Compile PRs with the repository's sole supported VS 2026 toolchain.
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]

    strategy:
      fail-fast: false
      matrix:
        platform: ["Win32", "x64"]

    defaults:
      run:
        shell: pwsh
        working-directory: s

    env:
      BUILD_CONFIGURATION: Debug
      SOLUTION_PATH: '.\src\vcxproj\salamand.sln'
      LOG_DIRECTORY: build_logs
      # Project files and PR validation share the VS 2026 v145 compiler contract.
      PLATFORM_TOOLSET: v145

    steps:
      - name: Checkout
        # Pin actions by reviewed commit to keep PR execution independent of moved tags.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: s

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Setup MSVC Developer Command Prompt (${{ matrix.platform }} target)
        run: |
          # VsDevCmd controls target CRT/LIB paths; PreferredToolArchitecture below controls only the compiler host.
          $targetArchitecture = if ('${{ matrix.platform }}' -eq 'Win32') { 'x86' } else { 'x64' }
          .\tools\setup-vs2026-buildtools.ps1 -TargetArchitecture $targetArchitecture

      - name: Verify MSVC target environment
        run: |
          # Fail before compilation if a persisted runner environment exposes the wrong target libraries.
          $expectedArchitecture = if ('${{ matrix.platform }}' -eq 'Win32') { 'x86' } else { 'x64' }
          if ($env:VSCMD_ARG_TGT_ARCH -ne $expectedArchitecture) {
            throw "Expected MSVC target '$expectedArchitecture', but VsDevCmd exported '$env:VSCMD_ARG_TGT_ARCH'."
          }
          # Check executable resolution as well as metadata so an unrelated PATH entry cannot select the opposite-architecture cross tools.
          $expectedToolSuffix = "\bin\Hostx64\$expectedArchitecture"
          foreach ($toolName in @('cl.exe', 'link.exe')) {
            $toolPath = (Get-Command $toolName -CommandType Application -ErrorAction Stop).Source
            if ($toolPath.IndexOf($expectedToolSuffix, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Expected $toolName below '$expectedToolSuffix', but PATH resolved '$toolPath'."
            }
            Write-Host "$toolName path: $toolPath"
          }
          Write-Host "MSVC target architecture: $env:VSCMD_ARG_TGT_ARCH"
          Write-Host "MSVC host architecture:   $env:VSCMD_ARG_HOST_ARCH"

      # Run the verifier's synthetic Git-history cases once per matrix to keep
      # vendor scoping, comment parsing, and actionable diagnostics stable.
      - name: Exercise raw thread-creation verifier
        if: matrix.platform == 'x64'
        run: .\tools\test-raw-thread-creation-verifier.ps1

      - name: Reject new forced thread termination
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          .\tools\verify-no-new-terminatethread.ps1 -BaseCommit origin/${{ github.event.pull_request.base.ref }}

      - name: Reject new raw thread creation
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          .\tools\verify-no-new-raw-thread-creation.ps1 -BaseCommit origin/${{ github.event.pull_request.base.ref }}

      - name: Reject new wrap-prone tick-count timing
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          .\tools\verify-no-new-gettickcount.ps1 -BaseCommit origin/${{ github.event.pull_request.base.ref }}

      - name: Reject new fixed MAX_PATH buffers
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          .\tools\verify-no-new-max-path-buffers.ps1 -BaseCommit origin/${{ github.event.pull_request.base.ref }}

      - name: Reject new unchecked string-copy and formatting calls
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          .\tools\verify-no-new-unsafe-string-calls.ps1 -BaseCommit origin/${{ github.event.pull_request.base.ref }}

      - name: Verify asynchronous operation completion protocol
        run: .\tools\verify-operation-completion-protocol.ps1

      - name: Verify durable copy commit protocol
        run: .\tools\verify-durable-copy-commit.ps1

      - name: Exercise zlib compatibility and corrupt-input vectors
        if: matrix.platform == 'x64'
        run: .\tools\test-zlib-compatibility.ps1

      - name: Exercise bzip2 golden archives, truncation, and fuzz corpus
        if: matrix.platform == 'x64'
        run: .\tools\test-bzip2-compatibility.ps1

      - name: Exercise cmark-gfm snapshots, limits, and extension fuzz combinations
        if: matrix.platform == 'x64'
        run: .\tools\test-cmark-gfm-hardening.ps1

      - name: Register MSVC problem matcher
        # This reviewed commit replaces the mutable master branch in PR builds.
        uses: ammaraskar/msvc-problem-matcher@541aa4360062d76d9620af6b8bd35cfa0c5ef19f

      - name: Build via MSBuild (Debug | ${{ matrix.platform }})
        run: |
          $logDir = Join-Path (Get-Location) $env:LOG_DIRECTORY
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $suffix = "${{ matrix.platform }}-run$($env:GITHUB_RUN_NUMBER)"
          $txtLog = Join-Path $logDir "msbuild-$($env:BUILD_CONFIGURATION)-$suffix.log"

          Add-Content -Path $env:GITHUB_ENV -Value "LOG_PATH=$txtLog"

          # Match the tool host to the matrix row as a defense against runner-specific x64 library-path leakage.
          $preferredToolArchitecture = if ('${{ matrix.platform }}' -eq 'Win32') { 'x86' } else { 'x64' }

          $arguments = @(
            $env:SOLUTION_PATH
            '/m'
            '/t:Rebuild'
            "/p:Configuration=$($env:BUILD_CONFIGURATION)"
            "/p:Platform=${{ matrix.platform }}"
            "/p:PlatformToolset=$($env:PLATFORM_TOOLSET)"
            "/p:PreferredToolArchitecture=$preferredToolArchitecture"
            '/warnaserror'
            '/nr:false'
            '/v:m'
          )

          msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            Write-Host "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Exercise SQLite WAL recovery and corrupt-page detection
        # The native DLL must be built first; this x64 probe owns only a GUID-named temporary database.
        if: matrix.platform == 'x64'
        run: .\tools\test-sqlite-recovery.ps1 -SqliteDll .\src\vcxproj\sqlite\salamander\Debug_x64\utils\sqlite.dll

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msbuild-${{ matrix.platform }}-debug-logs
          path: |
            ${{ env.LOG_PATH }}
          if-no-files-found: warn
