name: Nightly Lock Stress

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BUILD_CONFIGURATION: Debug
  SOLUTION_PATH: 'src\\vcxproj\\salamand.sln'
  PLATFORM_TOOLSET: v145
  OPENSAL_BUILD_DIR: '${{ github.workspace }}\\build_stage\\'
  FILEMANAGER_UI_ISOLATED: '1'
  # The diagnostic lane must use the same disposable profile boundary as the blocking release suite.
  FILEMANAGER_UI_CONFIG_ROOT: 'Software\Open Salamander\6.0-filemanager-testdata'
  FILEMANAGER_UI_CONFIG_FAULT_INJECTION: '1'
  FILEMANAGER_UI_RECYCLE_BIN: '1'
  # Nightly retains the longer resource-growth sample after the provider startup probes pass.
  FILEMANAGER_UI_LEAK_CYCLES: '100'

jobs:
  verifier-lock-stress:
    # FlaUI needs an unlocked desktop and an isolated profile; this label is deliberately not a hosted runner.
    runs-on:
      group: FileManager UI
      labels: [self-hosted, windows, filemanager-ui]

    steps:
      - name: Checkout
        # Pin actions by reviewed commit to keep the nightly diagnostic lane reproducible.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10 SDK
        # The verifier tests share the net10.0-windows UI-test target with the release gate.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        # Use the same fixed Visual Studio 2026 environment as the release lane.
        shell: pwsh
        run: .\tools\setup-vs2026-buildtools.ps1

      - name: Build Debug x64 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OPENSAL_BUILD_DIR | Out-Null
          msbuild $env:SOLUTION_PATH /m /t:Build /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=x64 /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=x64 /nr:false

      - name: Resolve Application Verifier diagnostic inputs
        shell: pwsh
        run: |
          $appVerifier = Get-Command appverif.exe -ErrorAction SilentlyContinue
          if ($null -eq $appVerifier) {
            $appVerifier = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Filter appverif.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if ($null -eq $appVerifier) {
            throw 'Application Verifier is required on the filemanager-ui runner.'
          }
          $appVerifierPath = if ($appVerifier -is [System.Management.Automation.CommandInfo]) {
            $appVerifier.Source
          } else {
            $appVerifier.FullName
          }

          $executable = Get-ChildItem $env:OPENSAL_BUILD_DIR -Filter salamand.exe -Recurse |
            Where-Object { $_.FullName -like '*Debug_x64*' } |
            Select-Object -First 1
          if ($null -eq $executable) {
            throw 'The Debug x64 salamand.exe build output was not found.'
          }

          # Persist exact paths across steps so every layer instruments the binary just built by this run.
          "FILEMANAGER_UI_EXE=$($executable.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FILEMANAGER_APPVERIFIER_EXE=$appVerifierPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run baseline startup probe without Application Verifier
        shell: pwsh
        # Prove the desktop, executable, and disposable sandbox before attributing any startup failure to a verifier provider.
        run: dotnet test .\tests\FileManager.UiTests\FileManager.UiTests.csproj --filter 'TestCategory=VerifierStartup' --results-directory TestResults\application-verifier-logs\baseline --logger 'trx;LogFileName=baseline-startup.trx' --logger 'console;verbosity=normal' -- NUnit.NumberOfTestWorkers=0

      - name: Identify the first verifier layer that blocks startup
        shell: pwsh
        # Enable one provider at a time; the resulting TRX, native window state, and verifier XML identify a real startup fault.
        run: |
          foreach ($layer in @('Locks', 'Handles', 'Heaps', 'Exceptions')) {
            .\tools\run-lock-verifier-stress.ps1 -ExecutablePath $env:FILEMANAGER_UI_EXE `
              -TestProject '.\tests\FileManager.UiTests\FileManager.UiTests.csproj' `
              -AppVerifierPath $env:FILEMANAGER_APPVERIFIER_EXE `
              -LogOutputDirectory (Join-Path 'TestResults\application-verifier-logs' "startup-$layer") `
              -VerifierLayers $layer -TestFilter 'TestCategory=VerifierStartup'
          }

      - name: Run Application Verifier and PageHeap UI suite
        shell: pwsh
        # Only run broad UI coverage after every individual provider reaches a usable native main window.
        run: .\tools\run-lock-verifier-stress.ps1 -ExecutablePath $env:FILEMANAGER_UI_EXE -TestProject '.\tests\FileManager.UiTests\FileManager.UiTests.csproj' -AppVerifierPath $env:FILEMANAGER_APPVERIFIER_EXE -LogOutputDirectory 'TestResults\application-verifier-logs\full-ui' -VerifierProfile Full -TestFilter 'TestCategory=UI'

      - name: Upload Application Verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-verifier-diagnostic-logs
          path: TestResults\application-verifier-logs
          if-no-files-found: warn
